<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin: 10px 0;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #output {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 500px;
            overflow-y: auto;
        }
        .info {
            background-color: #e3f2fd;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <h1>SVG Path Extractor</h1>
    
    <div class="info">
        <strong>Instructions:</strong>
        <ol>
            <li>Paste your SVG content into the text area below</li>
            <li>Click "Extract Paths"</li>
            <li>Copy the extracted paths from the output section</li>
        </ol>
    </div>

    <label for="input"><strong>Input SVG Content:</strong></label>
    <textarea id="input" placeholder="Paste your SVG content here..."></textarea>
    
    <button onclick="extractPaths()">Extract Paths</button>
    
    <h2>Extracted Paths:</h2>
    <div id="output">Results will appear here...</div>

    <script>
        function extractPaths() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            
            if (!input.trim()) {
                output.textContent = 'Please paste SVG content first!';
                return;
            }

            // Find all <path> elements
            const pathRegex = /<path[^>]*>/g;
            const pathMatches = input.match(pathRegex);
            
            if (!pathMatches) {
                output.textContent = 'No <path> elements found in the input!';
                return;
            }
            
            let matches = [];
            
            // Extract id and d from each path element
            pathMatches.forEach(pathElement => {
                const idMatch = pathElement.match(/id="([^"]+)"/);
                const dMatch = pathElement.match(/d="([^"]+)"/);
                
                if (idMatch && dMatch) {
                    matches.push({
                        id: idMatch[1],
                        d: dMatch[1]
                    });
                }
            });
            
            if (matches.length === 0) {
                output.textContent = `Found ${pathMatches.length} <path> elements, but none have both id and d attributes.`;
                return;
            }
            
            // Generate output
            let result = `Found ${matches.length} states with path data\n\n`;
            
            matches.forEach(item => {
                result += `<path id="${item.id}" class="state" d="${item.d}" stroke-width="1.8" fill="#fff0e1" stroke="#f5c9b4"></path>\n\n`;
            });
            
            output.textContent = result;
            
            console.log(`Extracted ${matches.length} paths`);
        }
    </script>
</body>
</html>
