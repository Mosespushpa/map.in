<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map.in — Historical Geography Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components/timeline.css">
  <link rel="stylesheet" href="components/tags.css">
</head>
<body class="dark">

  <!-- ── NAVBAR ── -->
  <nav class="navbar" id="navbar">
    <div class="navbar-brand">
      <img src="logo.avif" alt="Logo" class="navbar-logo" onerror="this.style.display='none'">
      <span class="navbar-title">Map.in</span>
      <span class="navbar-tagline">Historical Geography Explorer</span>
    </div>
    <div class="navbar-search-wrap">
      <div class="search-box" id="searchBox" style="display:none">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search states, rivers, forts…" autocomplete="off">
        <button id="searchClear"><i class="fas fa-times"></i></button>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
    <div class="navbar-controls">
      <button class="nav-btn" id="searchToggleBtn" title="Search"><i class="fas fa-search"></i></button>
      <button class="nav-btn active" id="themeToggleBtn" title="Toggle theme"><i class="fas fa-moon"></i></button>
    </div>
  </nav>

  <!-- ── TAGS ROW — populated by components/tags.js ── -->
  <div class="tags-row" id="tagsRow"></div>

  <!-- ── MAIN LAYOUT ── -->
  <div class="app-body">

    <!-- LEFT: Timeline — populated by components/timeline.js -->
    <div id="standaloneTimeline"></div>

    <!-- CENTER: Map -->
    <main class="map-area" id="mapArea">
      <div class="map-loading" id="mapLoading"><i class="fas fa-spinner fa-spin"></i></div>
      <svg id="india-map" viewBox="0 0 432 488" preserveAspectRatio="xMidYMid meet">
        <g class="regions" id="mapRegions"></g>
      </svg>
    </main>

  </div>

  <!-- ── SIDE PANEL ── -->
  <section class="side-panel" id="sidePanel">
    <div class="sp-placeholder" id="spPlaceholder">
      <i class="fas fa-map-marked-alt"></i>
      <p>Hover or click a region to explore its history</p>
    </div>
    <div class="sp-content hidden" id="spContent">
      <div class="sp-header">
        <div class="sp-icon" id="spIcon"><i class="fas fa-map"></i></div>
        <div>
          <h2 id="spTitle"></h2>
          <span class="sp-sub" id="spSub"></span>
        </div>
        <button class="sp-close" id="spClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="sp-body">
        <p id="spDesc"></p>
        <div id="spStats"></div>
        <div id="spFacts"></div>
        <div id="spEvents"></div>
      </div>
    </div>
  </section>

  <!-- ── Scripts ── -->
  <!-- 1. Core data + map logic -->
  <script src="script.js"></script>
  <!-- 2. Timeline-driven data engine -->
  <script src="timeline-data.js"></script>
  <!-- 3. Standalone components -->
  <script src="components/timeline.js"></script>
  <script src="components/tags.js"></script>
  <!-- 4. Event bridges -->
  <script>
    // yearChanged → update map year filter + timeline engine
    document.addEventListener('yearChanged', function (e) {
      if (typeof setYear === 'function') setYear(e.detail);
    });
    // categoryChanged → update map overlays
    document.addEventListener('categoryChanged', function (e) {
      if (typeof currentCategory !== 'undefined') currentCategory = e.detail;
      if (typeof applyOverlays === 'function') applyOverlays();
    });
  </script>

</body>
</html>
