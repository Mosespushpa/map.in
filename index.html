<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map.in — Historical Geography Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <!-- ── NAVBAR ── -->
  <nav class="navbar" id="navbar">
    <div class="navbar-brand">
      <img src="logo.avif" alt="Logo" class="navbar-logo" onerror="this.style.display='none'">
      <span class="navbar-title">Map.in</span>
      <span class="navbar-tagline">Historical Geography Explorer</span>
    </div>
    <div class="navbar-search-wrap">
      <div class="search-box" id="searchBox" style="display:none">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search states, rivers, forts…" autocomplete="off">
        <button id="searchClear"><i class="fas fa-times"></i></button>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
    <div class="navbar-controls">
      <button class="nav-btn" id="searchToggleBtn" title="Search"><i class="fas fa-search"></i></button>
      <button class="nav-btn active" id="themeToggleBtn" title="Toggle theme"><i class="fas fa-moon"></i></button>
    </div>
  </nav>

  <!-- ── TAGS ROW ── -->
  <div class="tags-row" id="tagsRow"></div>

  <!-- ── MAIN AREA ── -->
  <div class="app-body">

    <!-- LEFT: Timeline -->
    <aside class="timeline-panel" id="timelinePanel">
      <div class="timeline-header">
        <span class="tl-label">Timeline</span>
        <span class="tl-year" id="tlYear">2024</span>
      </div>
      <div class="timeline-track-wrap">
        <div class="timeline-track" id="tlTrack">
          <div class="timeline-fill" id="tlFill"></div>
          <div class="timeline-handle" id="tlHandle" tabindex="0" role="slider"
               aria-valuemin="1947" aria-valuemax="2024" aria-valuenow="2024">
            <span class="handle-pip"></span>
          </div>
          <!-- milestones injected by JS -->
        </div>
      </div>
    </aside>

    <!-- CENTER: Map -->
    <main class="map-area" id="mapArea">
      <div class="map-loading" id="mapLoading"><i class="fas fa-spinner fa-spin"></i></div>
      <svg id="india-map" viewBox="0 0 432 488" preserveAspectRatio="xMidYMid meet">
        <g class="regions" id="mapRegions">
          <!-- paths injected by loadMap() in script.js -->
        </g>
      </svg>
    </main>

  </div>

  <!-- ── SIDE PANEL (bottom) ── -->
  <section class="side-panel" id="sidePanel">
    <div class="sp-placeholder" id="spPlaceholder">
      <i class="fas fa-map-marked-alt"></i>
      <p>Hover or click a region to explore its history</p>
    </div>
    <div class="sp-content hidden" id="spContent">
      <div class="sp-header">
        <div class="sp-icon" id="spIcon"><i class="fas fa-map"></i></div>
        <div>
          <h2 id="spTitle"></h2>
          <span class="sp-sub" id="spSub"></span>
        </div>
        <button class="sp-close" id="spClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="sp-body">
        <p id="spDesc"></p>
        <div id="spStats"></div>
        <div id="spFacts"></div>
        <div id="spEvents"></div>
      </div>
    </div>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
